# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Reusable (workflow_call) workflows, their caller templates, and the scripts they
# run (cross-repo reports, Unraid plugin releases). A defect here propagates to
# every repo that calls them, so review it as shared infra.
language: en-US
reviews:
  # assertive: chill passed a diff clean that assertive flagged with two Major findings (2026-09-03); the "**" rule keeps style nits out
  profile: assertive
  request_changes_workflow: false
  pre_merge_checks:
    # off: the 80% docstring-coverage warning contradicts the one-line-docstring rule under "**"
    docstrings:
      mode: "off"
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: ".github/workflows/**"
      instructions: |-
        Reusable workflows consumed by other repos — a change here ships to every caller at once:
        - A reusable workflow gets NO permissions from its caller: it must declare its own `permissions:` block, least-privilege, per job. A missing or over-broad block is the defect — a missing one can fail the run at startup, and an over-broad one hands every caller write scope it never asked for.
        - Treat inputs and secrets as the public API. Adding a REQUIRED input, renaming one, or removing a default is a breaking change for every caller in templates/ — flag it unless the matching caller template changes in the same PR.
        - `secrets: inherit` hands the caller's entire secret set over. Prefer naming the specific secrets a workflow needs. Never echo a secret, and never let one reach a `run:` block's argv where it lands in logs.
        - Never interpolate untrusted input (PR title, branch name, issue body, tag) directly into `run:` — that is script injection. Pass it through `env:` and quote the expansion.
        - Pin third-party actions by commit SHA, not a mutable tag; a tag can be moved under you.
        - `pull_request_target` and workflows triggered by forks run with write access to the base repo — they must never check out or execute untrusted PR code.
        - When a gate that used to BLOCK becomes non-blocking, audit every downstream step that relied on it. Enumerate allowed states positively (`== 'success' || == 'skipped'`), never by negation — a third state slips through `!= 'failure'`.
    - path: "templates/caller-*.yml"
      instructions: |-
        Caller templates — what other repos copy in:
        - Must stay in lockstep with the reusable workflow they call. An input added, renamed or made required upstream has to appear here, or every repo that copies this template breaks on its next run.
        - Keep the `uses:` reference pinned the way callers should pin it; the template is the example people follow, so a sloppy ref here propagates.
        - Grant the caller only the permissions the reusable workflow actually needs.
    - path: "scripts/{digest,dependency_report,cross_repo_audit,renovate_dashboard,active_repos}.py"
      instructions: |-
        Cross-repo reporting scripts (digest, dependency report, audit, renovate dashboard) and the repo list they share:
        - They authenticate to the GitHub API: never log, print or embed a token, and never place one in a URL — an HTTP client exception carries the full request URL into the traceback.
        - Distinguish a genuine empty result from a failed call. An API error, rate-limit or 5xx must not be reported as "no findings" — that turns a broken audit into a clean-looking report, which is worse than no report.
        - Handle pagination explicitly; a first-page-only read silently under-reports across dozens of repos.
        - Respect the API rate limit on new call paths, including loops added over the repo list, and back off on 429 using Retry-After.
        - active_repos.py decides which repos every sweep and digest covers. A repo missing from its output is skipped by all of them with no error, so flag a new entry in SKIP_REPOS that is not a pure upstream tracker, and anything that reads a failed `gh repo list` as an empty portfolio.
    - path: "scripts/plg_release*"
      instructions: |-
        Unraid plugin release tooling, run inside each plugin repo by unraid-plugin-release.yml (with a token that can push branches, tags and releases) and unraid-plugin-test-build.yml:
        - The token must never reach the plugin's own build command: plg_git_deauth and `env -u GH_TOKEN` come before it, plg_git_auth after. Flag a step between them that needs the token, and any path that leaves the authenticated remote URL in .git/config across a build.
        - A cut goes tag, GitHub release, verify the asset, then move the channel branch, so the manifest users fetch only ever points at a package that checked out. Flag a reorder, and a failure after the tag that does not say how to undo it.
        - A failed lookup or sub-command must stop the release, not ship it short. `set -e` does not reach into a `$( )` used as an argument or behind `local`, and a pipe into `grep -c` turns a failed command into "nothing to release": capture first, then test.
        - A value read from GitHub or a manifest that lands in a URL, or in the root command the release notes ask users to paste, must match the release-version shape first.
        - A release-PR refresh rebuilds release/<channel> from the channel branch and carries over only the changelog. It must stop when that branch holds any other edit, and force-push only with a lease on the commit it read.
        - A merge between channels keeps the receiving branch's version, md5 and pluginURL; only the changelog and the .plg may conflict, and CHANGES is rendered again for the receiving channel. Stable takes a beta by its release tag, never unreleased work on the beta branch.
        - plg_release.py exits 0 for ok, 1 when a check found problems, 2 when the command could not run. Callers and new subcommands keep that meaning.
    - path: "scripts/tests/**"
      instructions: |-
        pytest for the scripts, and for `run:` steps lifted out of the workflow files:
        - A test runs the real script, function or workflow step, not a copy of its logic. Flag a fixture that stubs the part that can fail.
        - Tests work in a temp repo with a fake `gh`. None may reach the network, push, or touch a real checkout.
    - path: "{default.json,templates/*.json}"
      instructions: |-
        Shared Renovate and release-please defaults inherited by other repos:
        - Automerge must not cover a base-image, runtime or toolchain major jump — green checks on a config-only PR do not prove the image still builds.
        - A change here is a change to every consuming repo's update behaviour; call out the blast radius explicitly.
    - path: "**"
      instructions: |-
        Applies to every file, whatever the language:
        - Comments are navigational or instructional only and capped at 1-2 lines:
          what a non-obvious block does, or the gotcha it guards. No why/history
          essays, no before/after narrative, no restating the code, no section
          banners. Docstrings: one line unless the signature genuinely cannot
          carry it. Never ask for a docstring to be added; a missing docstring
          is not a finding.
        - The 1-2 line cap wins even inside an already heavily-commented file —
          matching local density is not licence to exceed it.
        - A comment, docstring, help text, column header, log message or UI label
          that disagrees with what the code does is a correctness finding, not a
          stale-comment nit: report it and say which side is wrong.
        - Do not flag stylistic preferences that are consistent across the file
          (naming, quoting, import order, formatting, line length). Report
          correctness, security, data-loss and the classes named above.

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
