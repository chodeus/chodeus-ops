name: Reusable — release-please

on:
  workflow_call:
    inputs:
      config_file:
        description: 'Path to release-please config.'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest_file:
        description: 'Path to release-please manifest.'
        required: false
        type: string
        default: '.release-please-manifest.json'
      automerge:
        description: 'Keep open release PRs up to date with the default branch and turn on squash auto-merge, so each release merges itself once its checks pass. Needs "Allow auto-merge" in the repository settings.'
        required: false
        type: boolean
        default: false
    outputs:
      release_created:
        description: '"true" if a release was cut this run (commits pushed main → tag + release).'
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: 'The new tag, e.g. v1.2.3.'
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: 'The new version without v prefix, e.g. 1.2.3.'
        value: ${{ jobs.release.outputs.version }}
      major:
        value: ${{ jobs.release.outputs.major }}
      minor:
        value: ${{ jobs.release.outputs.minor }}
      patch:
        value: ${{ jobs.release.outputs.patch }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Approves the CI runs on the release PRs; see the last step.
      actions: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}

      # Opted-in callers only. A behind release PR never merges under strict checks, so update it;
      # the job token's update starts runs awaiting approval, which the next step approves.
      - name: Keep the release PRs mergeable
        id: refresh
        if: ${{ inputs.automerge }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          updated=""
          # Only release-please's own PRs: never a fork branch that borrows the name.
          open=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"$GH_REPO\" and .base.ref == \"$BASE\" and .user.login == \"github-actions[bot]\" and (.head.ref | startswith(\"release-please--\"))) | .number") || { echo "::warning::Could not list open PRs."; exit 0; }
          for n in $open; do
            head=$(gh api "repos/$GH_REPO/pulls/$n" --jq .head.sha) || { echo "::warning::Could not read #$n."; continue; }
            behind=$(gh api "repos/$GH_REPO/compare/$BASE...$head" --jq .behind_by) || behind=0
            if [ "${behind:-0}" -gt 0 ]; then
              if gh api -X PUT "repos/$GH_REPO/pulls/$n/update-branch" -f expected_head_sha="$head" >/dev/null; then
                updated="$updated $n"; echo "Updated #$n, which was $behind commit(s) behind $BASE."
              else
                echo "::warning::Could not update #$n."
              fi
            fi
            state=$(gh api "repos/$GH_REPO/pulls/$n" --jq '"\(.node_id) \(.auto_merge != null)"') || continue
            node=${state% *}
            [ "${state#* }" = true ] && { echo "Auto-merge already on for #$n."; continue; }
            if gh api graphql -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }' -f id="$node" >/dev/null; then
              echo "Auto-merge on for #$n."
            else
              echo "::warning::Could not turn on auto-merge for #$n; it may already be on, or the repository may not allow it."
            fi
          done
          echo "updated=$(echo $updated)" >> "$GITHUB_OUTPUT"

      # A PR opened or updated with the job token starts its runs awaiting approval.
      # Runs can appear seconds apart, so poll the full 2 minutes and approve each as it appears.
      - name: Approve the release PRs' CI runs
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.refresh.outputs.updated != '' }}
        # Best-effort: a failure here must not fail the release job, which gates the image publish.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs || '[]' }}
          UPDATED: ${{ steps.refresh.outputs.updated }}
        run: |
          # No set -e: every API call warns and the next poll is the retry.
          set -uo pipefail
          nums=$( { jq -r '.[].number' <<< "$PRS"; for u in $UPDATED; do echo "$u"; done; } | sort -un)
          approved=0
          for i in $(seq 0 12); do
            for n in $nums; do
              # Read every poll: an update-branch moves the head a few seconds after it returns.
              sha=$(gh api "repos/$GH_REPO/pulls/$n" --jq .head.sha) || { echo "::warning::Could not read #$n; retrying next poll."; continue; }
              ids=$(gh api --paginate "repos/$GH_REPO/actions/runs?head_sha=$sha&status=action_required&event=pull_request" --jq '.workflow_runs[].id') || { echo "::warning::Could not list runs for #$n; retrying next poll."; continue; }
              for id in $ids; do
                if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
                  approved=$((approved + 1)); echo "Approved run $id"
                else
                  echo "::warning::Could not approve run $id; it may already be approved."
                fi
              done
            done
            [ "$i" -lt 12 ] && sleep 10
          done
          echo "Approved ${approved} run(s) on release PR(s) $(echo $nums | sed 's/[^ ]*/#&/g')." | tee -a "$GITHUB_STEP_SUMMARY"
