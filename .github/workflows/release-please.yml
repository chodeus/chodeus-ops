name: Reusable — release-please

on:
  workflow_call:
    inputs:
      config_file:
        description: 'Path to release-please config.'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest_file:
        description: 'Path to release-please manifest.'
        required: false
        type: string
        default: '.release-please-manifest.json'
    outputs:
      release_created:
        description: '"true" if a release was cut this run (commits pushed main → tag + release).'
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: 'The new tag, e.g. v1.2.3.'
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: 'The new version without v prefix, e.g. 1.2.3.'
        value: ${{ jobs.release.outputs.version }}
      major:
        value: ${{ jobs.release.outputs.major }}
      minor:
        value: ${{ jobs.release.outputs.minor }}
      patch:
        value: ${{ jobs.release.outputs.patch }}

permissions:
  contents: write
  pull-requests: write
  # Approves the CI runs on the release PR; see the last step.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}

      # A PR opened or updated with the job token starts its runs awaiting approval.
      # Approve them as they appear; stop after two empty polls once one was found, or at 2 minutes.
      - name: Approve the release PR's CI runs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.sha)
          approved=0; quiet=0
          for _ in $(seq 1 12); do
            ids=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&status=action_required" --jq '[.workflow_runs[].id] | join(" ")')
            if [ -z "$ids" ]; then
              if [ "$approved" -gt 0 ]; then quiet=$((quiet + 1)); [ "$quiet" -ge 2 ] && break; fi
            else
              quiet=0
              for id in $ids; do
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null
                approved=$((approved + 1)); echo "Approved run $id"
              done
            fi
            sleep 10
          done
          echo "Approved ${approved} run(s) on #${PR} (${sha:0:7})." | tee -a "$GITHUB_STEP_SUMMARY"
