name: Reusable — release-please

on:
  workflow_call:
    inputs:
      config_file:
        description: 'Path to release-please config.'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest_file:
        description: 'Path to release-please manifest.'
        required: false
        type: string
        default: '.release-please-manifest.json'
    outputs:
      release_created:
        description: '"true" if a release was cut this run (commits pushed main → tag + release).'
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: 'The new tag, e.g. v1.2.3.'
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: 'The new version without v prefix, e.g. 1.2.3.'
        value: ${{ jobs.release.outputs.version }}
      major:
        value: ${{ jobs.release.outputs.major }}
      minor:
        value: ${{ jobs.release.outputs.minor }}
      patch:
        value: ${{ jobs.release.outputs.patch }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      # Approves the CI runs on the release PRs; see the last step.
      actions: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}

      # A PR opened or updated with the job token starts its runs awaiting approval.
      # Runs can appear seconds apart, so poll the full 2 minutes and approve each as it appears.
      - name: Approve the release PRs' CI runs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        # Best-effort: a failure here must not fail the release job, which gates the image publish.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          nums=$(jq -r '.[].number' <<< "$PRS")
          shas=""
          for n in $nums; do shas="$shas $(gh api "repos/$GH_REPO/pulls/$n" --jq .head.sha)"; done
          approved=0
          for _ in $(seq 1 12); do
            ids=""
            for sha in $shas; do
              ids="$ids $(gh api --paginate "repos/$GH_REPO/actions/runs?head_sha=$sha&status=action_required&event=pull_request" --jq '.workflow_runs[].id')"
            done
            for id in $ids; do
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
                approved=$((approved + 1)); echo "Approved run $id"
              else
                echo "::warning::Could not approve run $id; it may already be approved."
              fi
            done
            sleep 10
          done
          echo "Approved ${approved} run(s) on release PR(s) $(echo $nums | sed 's/[^ ]*/#&/g')." | tee -a "$GITHUB_STEP_SUMMARY"
