name: Script tests

# The release scripts are shared infrastructure; a defect here reaches every plugin repo.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r scripts/tests/requirements.txt

      - name: Run tests
        run: python -m pytest scripts/tests -q
