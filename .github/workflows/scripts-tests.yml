name: Script tests

# The release scripts are shared infrastructure; a defect here reaches every plugin repo.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r scripts/tests/requirements.txt

      - name: Run tests
        run: python -m pytest scripts/tests -q
