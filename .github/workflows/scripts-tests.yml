name: Script tests

# The release scripts are shared infrastructure; a defect here reaches every plugin repo.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/unraid-plugin-release.yml'
      - '.github/workflows/scripts-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r scripts/tests/requirements.txt

      - name: Run tests
        run: python -m pytest scripts/tests -q
