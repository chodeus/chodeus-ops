name: Reusable — Docker build & push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (defaults to repo name). Pushed as ghcr.io/<owner>/<name>.'
        required: false
        type: string
        default: ''
      dockerfile_path:
        description: 'Path to Dockerfile (default: Dockerfile at repo root).'
        required: false
        type: string
        default: 'Dockerfile'
      build_context:
        description: 'Build context directory (default: repo root).'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Comma-separated platforms.'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Push to GHCR. Set false for PR builds.'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Trivy severities that FAIL the build. Pair with trivy_ignore_unfixed.'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      trivy_report_severity:
        description: 'Trivy severities REPORTED to the job summary without failing. Visibility tier.'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      trivy_ignore_unfixed:
        description: 'Only count vulnerabilities that have a fix available. A base image routinely carries unfixable CVEs, so false here makes the gate go red for something no caller can act on.'
        required: false
        type: boolean
        default: true
      target:
        description: 'Dockerfile stage to build. Empty builds the final stage. Callers with a multi-stage image (e.g. lean + full) invoke this workflow once per target.'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Newline-separated KEY=VALUE build args.'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Semver (e.g. 1.3.2) to tag this build with. For releases cut by release-please, whose tag is pushed with GITHUB_TOKEN and so cannot trigger a tag-filtered build — the caller passes the version instead. Empty = no version tags.'
        required: false
        type: string
        default: ''
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  # Build the image locally (single platform, no push) and scan it, so findings
  # land BEFORE anything reaches GHCR. The multi-arch push only runs if this job
  # succeeds. Severities split across two steps — see the comment above them.
  scan:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          # Single platform only: buildx can `load` into the local daemon for
          # scanning; a multi-arch manifest cannot be loaded. The push job below
          # rebuilds all platforms (amd64 layers come from the gha cache).
          platforms: linux/amd64
          load: true
          push: false
          tags: chodeus-scan:${{ github.sha }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two tiers on purpose. The report tier is the wide net and never blocks;
      # the gate tier is narrow and blocks. Both honour trivy_ignore_unfixed, so
      # a base image carrying an unfixable CVE cannot wedge every caller's build.
      - name: Trivy scan (report, non-blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: chodeus-scan:${{ github.sha }}
          severity: ${{ inputs.trivy_report_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: '0'
          format: table
          output: trivy-report.txt

      - name: Publish scan report
        if: always()
        # Via env, not `${{ }}` inline: an expression is expanded before bash
        # parses the line, so a caller-supplied severity could inject a command.
        env:
          TRIVY_REPORT_SEVERITY: ${{ inputs.trivy_report_severity }}
          TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
        run: |
          {
            echo "### Image scan — ${TRIVY_REPORT_SEVERITY} (fixable only: ${TRIVY_IGNORE_UNFIXED})"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: chodeus-scan:${{ github.sha }}
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          # The report step above already installed trivy in this job.
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  build:
    needs: scan
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve image name
        id: name
        # Same reason as the scan job's report step: quoting does not help,
        # because the expression is substituted into the script before bash runs.
        env:
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
        run: |
          NAME="$IMAGE_NAME_INPUT"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REPOSITORY##*/}"; fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
