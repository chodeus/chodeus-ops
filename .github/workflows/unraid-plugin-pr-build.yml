name: Reusable — Unraid plugin PR build

# Builds a pull request's head into dist/ with a read-only token and hands it to "PR publish" as an
# artifact. The pull request's own build script runs here, so this job must never hold a write token.
# The version sits just above the base branch's release; the release tag is pr-<number>-<version>.

on:
  workflow_call:
    inputs:
      plg_file:
        description: 'Path to the .plg manifest, relative to repo root.'
        required: true
        type: string
      build_cmd:
        description: 'Build command; receives --version <v> --branch <b> and must write dist/<pkg>.txz.'
        type: string
        default: 'bash pkg_build.sh'
      pr_number:
        description: 'Pull request number (github.event.pull_request.number).'
        required: true
        type: number
      head_sha:
        description: 'Commit to build (github.event.pull_request.head.sha).'
        required: true
        type: string
      base_branch:
        description: 'Branch the pull request targets; pluginURL stays on it (github.event.pull_request.base.ref).'
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  PLG: ${{ inputs.plg_file }}
  BUILD_CMD: ${{ inputs.build_cmd }}
  PR: ${{ inputs.pr_number }}
  HEAD_SHA: ${{ inputs.head_sha }}
  BASE: ${{ inputs.base_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Version the build just above the base branch's release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be a number (got '$PR')"; exit 1; }
          [[ "$BASE" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::base_branch must be a plain branch name (got '$BASE')"; exit 1; }
          # Unraid orders versions with strcmp and refuses to install an older one: <release>.0<UTC build time>
          # sorts above the current release and below whatever is released next. PR publish checks the same rule.
          gh api "repos/$GITHUB_REPOSITORY/contents/$PLG?ref=$BASE" --jq .content | base64 -d > "$RUNNER_TEMP/base.plg"
          release=$(grep -o '<!ENTITY version *"[^"]*"' "$RUNNER_TEMP/base.plg" | grep -o '"[^"]*"' | tr -d '"')
          [[ "$release" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[0-9a-z.]*$ ]] || { echo "::error::unexpected version '$release' in $PLG on $BASE"; exit 1; }
          version="$release.0$(date -u +%y%m%d%H%M%S)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version for pull request #$PR at ${HEAD_SHA::7}"

      - name: Build the package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          read -ra build <<< "$BUILD_CMD"
          "${build[@]}" --version "$VERSION" --branch "$BASE"
          mapfile -t txz < <(find dist -maxdepth 1 -name '*.txz' -type f)
          [ "${#txz[@]}" -eq 1 ] || { echo "::error::expected exactly one dist/*.txz, found ${#txz[@]}"; exit 1; }

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Point the manifest at the pull request release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # A tag per build keeps every download URL unique: GitHub caches the tag+filename lookup for minutes.
          tag="pr-$PR-$VERSION"
          sed -i "s#/releases/download/v&version;/#/releases/download/$tag/#" "$PLG"
          grep -Fq "/releases/download/$tag/" "$PLG" || { echo "::error::$PLG package URL was not rewritten to /releases/download/$tag/: the manifest must download from /releases/download/v&version;/"; exit 1; }
          xmllint --noout "$PLG"
          cp "$PLG" "dist/$(basename "$PLG")"
          printf 'pr=%s\nversion=%s\nhead_sha=%s\nbase=%s\n' "$PR" "$VERSION" "$HEAD_SHA" "$BASE" > dist/build.env

      - name: Upload the build for PR publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-build-${{ inputs.pr_number }}
          path: dist
          retention-days: 14
