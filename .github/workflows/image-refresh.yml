name: Reusable — Image refresh

# Checks a published image for pending package upgrades and, if any, dispatches the
# caller's publish workflow, whose own gates decide whether the refresh ships.

on:
  workflow_call:
    inputs:
      image:
        description: 'Full image reference to check. Empty = ghcr.io/<owner>/<repo>:latest.'
        required: false
        type: string
        default: ''
      platform:
        description: 'Platform to pull for the check. Results cover only this platform; an upgrade published for another arch alone is missed until this one also has one.'
        required: false
        type: string
        default: 'linux/amd64'
      workflow:
        description: 'Workflow file in the calling repo to dispatch when the image is stale, e.g. docker-publish.yml. It must accept workflow_dispatch.'
        required: true
        type: string
      ref:
        description: 'Branch to dispatch the workflow on. Empty = the branch this run is on.'
        required: false
        type: string
        default: ''
      dispatch:
        description: 'False reports drift without dispatching anything.'
        required: false
        type: boolean
        default: true
      notify_dry_run:
        description: 'Compose the Discord message but do not post it (for smoke tests).'
        required: false
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        description: 'Posts the package changes when the image is stale, or a failure. Without it nothing is posted.'
        required: false
    outputs:
      stale:
        description: 'true when the image has pending package upgrades.'
        value: ${{ jobs.check.outputs.stale }}
      pending:
        description: 'Number of pending package upgrades.'
        value: ${{ jobs.check.outputs.pending }}
      packages:
        description: 'Pending upgrades, one "name<TAB>installed<TAB>available" line each.'
        value: ${{ jobs.check.outputs.packages }}

jobs:
  check:
    name: check (${{ inputs.platform }})
    # packages: the GHCR pull. Nothing here writes or checks out.
    permissions:
      packages: read
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.drift.outputs.stale }}
      pending: ${{ steps.drift.outputs.pending }}
      packages: ${{ steps.drift.outputs.packages }}
      image: ${{ steps.drift.outputs.image }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pending package upgrades
        id: drift
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          image="${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}:latest}"
          docker pull -q --platform "$PLATFORM" "$image" >/dev/null
          # Root and a plain shell: USER and ENTRYPOINT do not matter to the package manager.
          # Anything but a clean answer fails the job, so an unreadable image never reads as current.
          # Each query is captured before it is filtered: in a pipeline only the last
          # command's status counts, and a failed query must never read as "nothing pending".
          pending=$(docker run --rm --platform "$PLATFORM" --user 0 --entrypoint sh "$image" -c '
            set -e
            # Old indexes are cleared first, so an index found after the update came from it.
            if [ -f /etc/alpine-release ]; then
              rm -f /var/cache/apk/APKINDEX.*
              apk update -q >/dev/null
              ls /var/cache/apk/APKINDEX.*.tar.gz >/dev/null 2>&1 || { echo "no package index: no repositories configured" >&2; exit 5; }
              ver=$(apk version -l "<")
              printf "%s\n" "$ver" | tail -n +2
            elif [ -f /etc/debian_version ]; then
              export DEBIAN_FRONTEND=noninteractive
              rm -f /var/lib/apt/lists/*_Packages*
              upd=$(apt-get update -qq 2>&1) || { printf "%s\n" "$upd" >&2; exit 4; }
              if printf "%s\n" "$upd" | grep -q "^[WE]:"; then printf "%s\n" "$upd" >&2; exit 4; fi
              ls /var/lib/apt/lists/*_Packages* >/dev/null 2>&1 || { echo "no package index: no sources configured" >&2; exit 5; }
              sim=$(apt-get -s -qq upgrade)
              printf "%s\n" "$sim" | grep "^Inst " || true
            else
              echo "unsupported distro: neither /etc/alpine-release nor /etc/debian_version" >&2
              exit 3
            fi')
          count=$(printf '%s\n' "$pending" | grep -c . || true)
          # apk: "musl-1.2.6-r2  < 1.2.6-r3"; apt: "Inst libssl3 [3.0.11-1] (3.0.13-1 ...)".
          packages=$(printf '%s\n' "$pending" | python3 -c '
          import re, sys
          for line in filter(None, (l.strip() for l in sys.stdin)):
              apk = re.match(r"(\S+)\s+<\s+(\S+)", line)
              apt = re.match(r"Inst (\S+) (?:\[(\S+)\] )?\((\S+)", line)
              if apk:
                  parts = apk.group(1).rsplit("-", 2)
                  name, old = (parts[0], "-".join(parts[1:])) if len(parts) == 3 else (apk.group(1), "?")
                  print(f"{name}\t{old}\t{apk.group(2)}")
              elif apt:
                  old = apt.group(2) or "(new)"
                  print(f"{apt.group(1)}\t{old}\t{apt.group(3)}")
              else:
                  print(f"{line}\t?\t?")
          ')
          {
            echo "### Image refresh — ${image} (${PLATFORM})"
            if [ "$count" -eq 0 ]; then
              echo "No pending package upgrades."
            else
              echo "${count} pending package upgrade(s):"
              echo '```'
              printf '%s\n' "$pending"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          delim="EOF_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "pending=${count}"
            if [ "$count" -gt 0 ]; then echo "stale=true"; else echo "stale=false"; fi
            echo "image=${image}"
            echo "packages<<${delim}"
            printf '%s\n' "$packages"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  dispatch:
    name: dispatch
    needs: check
    if: ${{ inputs.dispatch && needs.check.outputs.stale == 'true' }}
    # actions: the workflow_dispatch, and reading back the run it started. A run started
    # this way with the job token is one of the two event types GitHub does create runs for.
    permissions:
      actions: write
    runs-on: ubuntu-latest
    outputs:
      run_url: ${{ steps.run.outputs.run_url }}
    steps:
      - name: Run the publish workflow
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
          REF: ${{ inputs.ref || github.ref_name }}
          PENDING: ${{ needs.check.outputs.pending }}
        run: |
          set -euo pipefail
          # The dispatch API returns no run id: the new run is one absent from this list and created after now.
          # The link is best-effort, so a lookup failure never fails the job.
          before=$(gh run list --workflow "$WORKFLOW" --branch "$REF" --event workflow_dispatch --limit 20 \
            --json databaseId --jq '[.[].databaseId]' || echo '[]')
          # A little before now, so runner clock skew can't hide the run from the lookup below.
          since=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$WORKFLOW" --ref "$REF"
          echo "Dispatched ${WORKFLOW} on ${REF}: ${PENDING} pending package upgrade(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          url=""
          for _ in $(seq 1 12); do
            url=$(gh run list --workflow "$WORKFLOW" --branch "$REF" --event workflow_dispatch --limit 20 \
              --json databaseId,url,createdAt \
              --jq "${before:-[]} as \$b | [.[] | select(.createdAt >= \"$since\" and ([.databaseId] | inside(\$b) | not))] | last | .url // empty" || true)
            [ -n "$url" ] && break
            sleep 5
          done
          echo "run_url=${url:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW}" >> "$GITHUB_OUTPUT"

  compose:
    name: compose message
    needs: [check, dispatch]
    # Stale, or a failed check or dispatch: a clean daily check posts nothing.
    if: ${{ always() && (needs.check.result == 'failure' || needs.dispatch.result == 'failure' || needs.check.outputs.stale == 'true') }}
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.msg.outputs.status }}
      title: ${{ steps.msg.outputs.title }}
      description: ${{ steps.msg.outputs.description }}
      url: ${{ steps.msg.outputs.url }}
    steps:
      - name: Compose
        id: msg
        env:
          CHECK: ${{ needs.check.result }}
          DISPATCH: ${{ needs.dispatch.result }}
          PENDING: ${{ needs.check.outputs.pending }}
          PACKAGES: ${{ needs.check.outputs.packages }}
          IMAGE: ${{ needs.check.outputs.image }}
          PLATFORM: ${{ inputs.platform }}
          WORKFLOW: ${{ inputs.workflow }}
          PUBLISH_URL: ${{ needs.dispatch.outputs.run_url }}
          THIS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, uuid
          env = os.environ
          name = env["GITHUB_REPOSITORY"].split("/", 1)[1]
          rows = [line.split("\t") for line in env.get("PACKAGES", "").splitlines() if line.strip()]
          shown, extra = rows[:10], len(rows) - 10
          width = max((len(r[0]) for r in shown), default=0)
          diff = []
          for r in shown:
              pkg, old, new = (r + ["?", "?"])[:3]
              diff += [f"- {pkg.ljust(width)}  {old}", f"+ {pkg.ljust(width)}  {new}"]
          block = "```diff\n" + "\n".join(diff) + "\n```" if diff else ""
          if extra > 0:
              block += f"\n… and {extra} more ([full list]({env['THIS_RUN']}))"
          where = f"`{env.get('IMAGE', '')}` ({env['PLATFORM']})"

          if env["CHECK"] == "failure":
              status, title, url = "failure", f"❌ {name} image refresh failed", env["THIS_RUN"]
              desc = "The package check failed; see the run."
          elif env["DISPATCH"] == "success":
              status, title = "info", f"♻️ {name} image refresh — {env['PENDING']} package(s)"
              url = env.get("PUBLISH_URL") or env["THIS_RUN"]
              desc = f"{where}\n{block}\n\nRebuilding: [{env['WORKFLOW']} run]({url})"
          elif env["DISPATCH"] == "skipped":
              status, title, url = "warning", f"♻️ {name} image has {env['PENDING']} pending package update(s)", env["THIS_RUN"]
              desc = f"{where}\n{block}\n\nDispatch is off, so nothing was rebuilt."
          else:
              status, title, url = "failure", f"❌ {name} image refresh failed", env["THIS_RUN"]
              desc = f"{where}\n{block}\n\n{env['PENDING']} package update(s) found, but `{env['WORKFLOW']}` could not be dispatched."

          delim = f"EOF_{uuid.uuid4().hex}"
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\ntitle={title}\nurl={url}\n")
              out.write(f"description<<{delim}\n{desc}\n{delim}\n")
          PY

  notify:
    needs: compose
    if: ${{ always() && needs.compose.result == 'success' }}
    permissions: {}
    # A full ref, not ./: the docs leave ./ undefined for a nested call made from another repo.
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@c9aa5b046ad37c375a332358f5309e13fae65667 # main
    with:
      event_type: workflow
      status: ${{ needs.compose.outputs.status }}
      title: ${{ needs.compose.outputs.title }}
      description: ${{ needs.compose.outputs.description }}
      url: ${{ needs.compose.outputs.url }}
      dry_run: ${{ inputs.notify_dry_run }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
