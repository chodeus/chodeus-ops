name: Reusable — Node lint

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '20'
      package_json_dir:
        required: false
        type: string
        default: '.'
      run_lint:
        required: false
        type: boolean
        default: true
      run_stylelint:
        required: false
        type: boolean
        default: false
      stylelint_glob:
        required: false
        type: string
        default: "src/**/*.css"
      run_prettier_check:
        required: false
        type: boolean
        default: false
      prettier_glob:
        required: false
        type: string
        default: "src/**/*.{js,jsx,css,json,md}"

permissions:
  contents: read

jobs:
  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.package_json_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.package_json_dir }}
        run: npm ci

      - name: Run ESLint
        if: inputs.run_lint
        working-directory: ${{ inputs.package_json_dir }}
        run: npm run lint

      - name: Run Stylelint
        if: inputs.run_stylelint
        working-directory: ${{ inputs.package_json_dir }}
        run: npx stylelint "${{ inputs.stylelint_glob }}"

      - name: Check Prettier formatting
        if: inputs.run_prettier_check
        working-directory: ${{ inputs.package_json_dir }}
        run: npx prettier --check "${{ inputs.prettier_glob }}"
