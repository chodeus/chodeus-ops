name: Smoke tests — reusables

# Runs each reusable that supports a dry/no-op path to catch input-contract
# drift (renamed inputs, removed outputs, broken YAML) before a change to
# a reusable reaches downstream repos. Static analysis (actionlint) can't
# do this across the workflow_call boundary.
#
# Keep additions cheap: a reusable that needs a source tree gets a fixture under
# scripts/tests/fixtures/ only when its contract is worth exercising on every change.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image-refresh.yml'
      - '.github/workflows/stale-issues.yml'
      - '.github/workflows/notify-discord.yml'
      - '.github/workflows/smoke-reusables.yml'
      - '.github/workflows/docker-build.yml'
      - 'scripts/tests/fixtures/healthcheck/**'
  pull_request:
    paths:
      - '.github/workflows/image-refresh.yml'
      - '.github/workflows/stale-issues.yml'
      - '.github/workflows/notify-discord.yml'
      - '.github/workflows/smoke-reusables.yml'
      - '.github/workflows/docker-build.yml'
      - 'scripts/tests/fixtures/healthcheck/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # An image old enough to always have pending upgrades, with dispatch off:
  # exercises the drift check end to end without starting anything.
  smoke-image-refresh:
    name: image-refresh (dispatch off)
    # packages: the pull. actions: write is what the dispatch job declares;
    # dispatch false skips it, but the grant is checked at startup.
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/image-refresh.yml
    with:
      image: alpine:3.20.0
      workflow: smoke-reusables.yml
      dispatch: false

  smoke-image-refresh-assert:
    name: image-refresh (stale detected)
    needs: smoke-image-refresh
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - env:
          STALE: ${{ needs.smoke-image-refresh.outputs.stale }}
          PENDING: ${{ needs.smoke-image-refresh.outputs.pending }}
        run: |
          echo "stale=${STALE} pending=${PENDING}"
          [ "$STALE" = "true" ] && [ "$PENDING" -gt 0 ]

  smoke-stale:
    name: stale-issues (no-op days)
    uses: ./.github/workflows/stale-issues.yml
    with:
      # 99999 days — no issue/PR will be marked or closed during the smoke.
      days_before_stale: 99999
      days_before_close: 99999

  # No secret passed: must skip, as for a repo without a webhook.
  smoke-notify-discord-no-webhook:
    name: notify-discord (no webhook)
    permissions: {}
    uses: ./.github/workflows/notify-discord.yml
    with:
      event_type: workflow
      status: info
      title: "smoke test — no webhook"

  smoke-notify-discord:
    name: notify-discord (dry_run)
    uses: ./.github/workflows/notify-discord.yml
    with:
      event_type: workflow
      status: info
      title: "smoke test — should not post"
      dry_run: true

  # Both platforms, never pushed, through the HEALTHCHECK gate: exercises the
  # plan/scan contract and the native arm64 leg on a fixture healthy in seconds.
  smoke-docker-build:
    name: docker-build (scan + healthcheck, no push)
    # security-events: the legs' SARIF upload. packages: write is what the build job
    # declares; push false skips it, but GitHub checks the grant at startup (run 35833873740 died without it).
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: smoke-fixture
      dockerfile_path: scripts/tests/fixtures/healthcheck/Dockerfile
      build_context: scripts/tests/fixtures/healthcheck
      platforms: linux/amd64,linux/arm64
      push: false
      smoke_healthcheck: true
      smoke_timeout: 60
