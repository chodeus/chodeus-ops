name: Smoke tests — reusables

# Runs each reusable that supports a dry/no-op path to catch input-contract
# drift (renamed inputs, removed outputs, broken YAML) before a change to
# a reusable reaches downstream repos. Static analysis (actionlint) can't
# do this across the workflow_call boundary.
#
# Keep additions cheap — reusables that need fake source trees (docker,
# python, node, codeql) aren't smoked here; add only when a contract
# breakage in one of them actually bites.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stale-issues.yml'
      - '.github/workflows/notify-discord.yml'
      - '.github/workflows/smoke-reusables.yml'
      - '.github/workflows/docker-build.yml'
      - 'scripts/tests/fixtures/healthcheck/**'
  pull_request:
    paths:
      - '.github/workflows/stale-issues.yml'
      - '.github/workflows/notify-discord.yml'
      - '.github/workflows/smoke-reusables.yml'
      - '.github/workflows/docker-build.yml'
      - 'scripts/tests/fixtures/healthcheck/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke-stale:
    name: stale-issues (no-op days)
    uses: ./.github/workflows/stale-issues.yml
    with:
      # 99999 days — no issue/PR will be marked or closed during the smoke.
      days_before_stale: 99999
      days_before_close: 99999

  smoke-notify-discord:
    name: notify-discord (dry_run)
    uses: ./.github/workflows/notify-discord.yml
    with:
      event_type: workflow
      status: info
      title: "smoke test — should not post"
      dry_run: true

  # A build on both platforms, never pushed, ending in the HEALTHCHECK smoke
  # gate. Exercises the plan/scan contract and the native arm64 leg on a
  # fixture image that turns healthy in seconds.
  smoke-docker-build:
    name: docker-build (scan + healthcheck, no push)
    # security-events: the legs' SARIF upload. packages: write is what the
    # build job declares; push false skips it, but the grant is checked at startup.
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: smoke-fixture
      dockerfile_path: scripts/tests/fixtures/healthcheck/Dockerfile
      build_context: scripts/tests/fixtures/healthcheck
      platforms: linux/amd64,linux/arm64
      push: false
      smoke_healthcheck: true
      smoke_timeout: 60
