name: Reusable — Unraid plugin release

# A push to a channel branch refreshes that channel's release PR; merging that PR cuts
# the release. Mechanics live in scripts/plg_release*.

on:
  workflow_call:
    inputs:
      plg_file:
        description: 'Path to the .plg manifest, relative to repo root.'
        required: true
        type: string
      changelog:
        description: 'Path to the editable changelog.'
        type: string
        default: CHANGELOG.md
      stable_branch:
        type: string
        default: main
      beta_branch:
        description: 'Beta channel branch. Empty = single-channel plugin.'
        type: string
        default: ''
      build_cmd:
        description: 'Build command; receives --version <v> --branch <b> and must write dist/<pkg>.txz.'
        type: string
        default: 'bash pkg_build.sh'
      tz:
        type: string
        default: Australia/Perth
      mode:
        description: 'auto | pr | release'
        type: string
        default: auto
      dry_run:
        type: boolean
        default: false
      git_user:
        type: string
        default: chodeus
      git_email:
        type: string
        default: 190988615+chodeus@users.noreply.github.com
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
    secrets:
      RELEASE_TOKEN:
        description: 'Fine-grained PAT, Contents + Pull requests read/write (no Issues scope needed). Release PRs must run CI, and pushes must bypass required checks.'
        required: true

permissions:
  contents: read

env:
  OPS: ${{ github.workspace }}/ops/scripts
  PLG: ${{ inputs.plg_file }}
  CHANGELOG: ${{ inputs.changelog }}
  GIT_USER: ${{ inputs.git_user }}
  GIT_EMAIL: ${{ inputs.git_email }}
  DRY_RUN: ${{ inputs.dry_run }}
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    # callers must grant the same: a called job asks for no more than its calling job allows
    permissions:
      contents: read
      # the built-in token restarts the other channel's run; RELEASE_TOKEN does everything else
      actions: write
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !endsWith(github.actor, '[bot]'))
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo
          # The branch tip, not the event commit: a queued or re-run job's commit can be behind the branch it pushes to.
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          # The scripts attach the token to origin themselves, around the pushes that need
          # it, so it is absent from .git/config while the plugin's build command runs.
          persist-credentials: false

      - name: Resolve release-scripts ref
        # Scripts come from the same chodeus-ops commit the caller pinned in its `uses:` line.
        id: opsref
        run: |
          set -euo pipefail
          wf="${GITHUB_WORKFLOW_REF#*/*/}"
          wf="${wf%@*}"
          # Anchor on the uses: key so a commented-out line cannot win, then take the
          # whole value up to a quote, space or comment so refs like a/b+c stay intact.
          # Read at the commit this run started from: the checkout is the branch tip, which may pin another ref.
          line=$(git -C repo show "$GITHUB_SHA:$wf" | grep -E "^[[:space:]]*uses:[[:space:]]*['\"]?chodeus/chodeus-ops/\.github/workflows/unraid-plugin-release\.yml@" | head -1 || true)
          ref="${line##*@}"
          ref="${ref%%[\"\'[:space:]]*}"
          ref="${ref%%#*}"
          # Fail rather than fall back: an unpinned guess would run unreviewed scripts with RELEASE_TOKEN.
          if [ -z "$ref" ]; then
            echo "::error::could not read the chodeus-ops ref from $wf at $GITHUB_SHA — the caller must name this workflow directly in a uses: line"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "release scripts ref: $ref"

      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chodeus/chodeus-ops
          ref: ${{ steps.opsref.outputs.ref }}
          path: ops
          sparse-checkout: scripts
          persist-credentials: false

      - name: Decide channel and mode
        id: decide
        working-directory: repo
        env:
          STABLE: ${{ inputs.stable_branch }}
          BETA: ${{ inputs.beta_branch }}
          MODE_IN: ${{ inputs.mode }}
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$MODE_IN" in
            auto|pr|release) ;;
            *) echo "::error::mode must be auto, pr or release (got '$MODE_IN')"; exit 1 ;;
          esac
          other="" other_branch=""
          if [ "$GITHUB_REF_NAME" = "$STABLE" ]; then
            ch="stable"
            [ -z "$BETA" ] || { other="beta"; other_branch="$BETA"; }
          elif [ -n "$BETA" ] && [ "$GITHUB_REF_NAME" = "$BETA" ]; then
            ch="beta" other="stable" other_branch="$STABLE"
          else
            echo "::notice::$GITHUB_REF_NAME is not a release channel"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # From state, not from the pushed commit: a merged release PR is due until a release tag contains its merge.
          # Prints the PR number when due. set -e does not reach into $( ), so every failure returns 1 itself.
          due() {  # $1 channel, $2 branch, $3 the branch's commit
            local latest merged released tag
            latest=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "release/$1" --base "$2" \
              --limit 20 --json number,mergeCommit,mergedAt,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository | not)] | sort_by(.mergedAt) | last | "\(.number // "") \(.mergeCommit.oid // "")"') || return 1
            merged="${latest#* }"
            [ -n "$merged" ] && git merge-base --is-ancestor "$merged" "$3" 2>/dev/null || return 0
            released=$(git tag --list 'v[0-9]*' --contains "$merged") || return 1
            # The cut commits on the branch and moves it last: a tag the branch has is a finished release, one whose
            # parent alone it has is this channel's cut that stopped part way, and any other is the other channel's.
            for tag in $released; do git merge-base --is-ancestor "refs/tags/$tag" "$3" && return 0; done
            for tag in $released; do
              git merge-base --is-ancestor "refs/tags/$tag^" "$3" 2>/dev/null || continue
              echo "::error::$tag contains the merge of #${latest%% *} but $2 does not have it: a release run stopped part way. Undo it with gh release delete $tag --cleanup-tag --yes (or git push --delete origin $tag if it made no release), then run Release again." >&2
              return 1
            done
            echo "${latest%% *}"
          }
          mode="$MODE_IN"
          pr=""
          if [ "$mode" = auto ]; then
            pr=$(due "$ch" "$GITHUB_REF_NAME" HEAD)
            if [ -n "$pr" ]; then mode="release"; else mode="pr"; fi
          fi
          # A release run skips refreshing the other channel's PR while that channel's merged release waits for its cut.
          other_pr=""
          if [ -n "$other" ] && { [ "$mode" = release ] || [ "${GITHUB_EVENT_NAME:-}" = push ]; }; then
            other_pr=$(due "$other" "$other_branch" "origin/$other_branch")
          fi
          # Both branches share one queue, so this push may have cancelled the other channel's waiting release: start it
          # again. Only from pushes, so two stuck channels cannot keep starting runs for each other; never from a dry run.
          if [ -n "$other_pr" ] && [ "${GITHUB_EVENT_NAME:-}" = push ] && [ "$DRY_RUN" != true ]; then
            caller="${GITHUB_WORKFLOW_REF%@*}"
            GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "${caller##*/}" --repo "$GITHUB_REPOSITORY" --ref "$other_branch" -f mode=auto
            echo "::notice::#$other_pr is merged into $other_branch without a release yet: started a Release run for it"
          fi
          {
            echo "channel=$ch"
            echo "mode=$mode"
            echo "pr_number=$pr"
            echo "other_pr=$other_pr"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$ch mode=$mode pr=${pr:-none}"

      - name: Refresh release PR
        if: steps.decide.outputs.mode == 'pr'
        working-directory: repo
        env:
          CHANNEL: ${{ steps.decide.outputs.channel }}
          BASE: ${{ github.ref_name }}
          BETA_BRANCH: ${{ inputs.beta_branch }}
        run: bash "$OPS/plg_release_pr.sh"

      - name: Install xmllint
        if: steps.decide.outputs.mode == 'release'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Cut release
        id: cut
        if: steps.decide.outputs.mode == 'release'
        working-directory: repo
        env:
          CHANNEL: ${{ steps.decide.outputs.channel }}
          BASE: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
          BUILD_CMD: ${{ inputs.build_cmd }}
          TZ: ${{ inputs.tz }}
        run: bash "$OPS/plg_release_cut.sh"

      # A beta release changes what the next stable will contain. A merged stable release still waiting for its cut
      # would be rebuilt into a new PR, so its own run refreshes instead.
      - name: Refresh stable release PR after a beta
        if: steps.decide.outputs.mode == 'release' && steps.decide.outputs.channel == 'beta' && steps.decide.outputs.other_pr == ''
        working-directory: repo
        env:
          CHANNEL: stable
          BASE: ${{ inputs.stable_branch }}
          BETA_BRANCH: ${{ inputs.beta_branch }}
        run: bash "$OPS/plg_release_pr.sh"

      # A stable release flows back into beta, keeping beta's manifest.
      - name: Merge stable back into beta
        if: steps.decide.outputs.mode == 'release' && steps.decide.outputs.channel == 'stable' && inputs.beta_branch != ''
        working-directory: repo
        env:
          BASE: ${{ inputs.stable_branch }}
          BETA_BRANCH: ${{ inputs.beta_branch }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: bash "$OPS/plg_release_backmerge.sh"

      # Likewise skipped while a merged beta release waits for its cut.
      - name: Refresh beta release PR after a stable
        if: steps.decide.outputs.mode == 'release' && steps.decide.outputs.channel == 'stable' && inputs.beta_branch != '' && steps.decide.outputs.other_pr == ''
        working-directory: repo
        env:
          CHANNEL: beta
          BASE: ${{ inputs.beta_branch }}
        run: bash "$OPS/plg_release_pr.sh"
