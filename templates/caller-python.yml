# Drop into .github/workflows/ci.yml of a Python repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: chodeus/chodeus-ops/.github/workflows/python-ci.yml@b99e2de33ae9b77ee53dbc1c2d35f7eb79b88181 # main
    with:
      python_versions: '["3.12"]'
