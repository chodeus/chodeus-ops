# Caller that removes a pull request's test builds when it closes. Checks out nothing.
# Mechanics: .github/workflows/unraid-plugin-pr-cleanup.yml.

name: PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
    # Pin to a reviewed chodeus-ops commit.
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-pr-cleanup.yml@f2a43b46d158b76831c8e8e63126b22baef761bb # main
    with:
      pr_number: ${{ github.event.pull_request.number }}
