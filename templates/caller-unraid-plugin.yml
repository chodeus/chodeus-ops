# Caller for the Unraid plugin release flow. Replace PLUGIN.plg in BOTH places below.
# Prerequisites, inputs and secrets: .github/workflows/unraid-plugin-release.yml.

name: Release

on:
  push:
    branches: [main, beta]
    paths:
      - 'src/**'
      - 'pkg_build.sh'
      - 'PLUGIN.plg'      # <- your manifest
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = decide from the pushed commit; pr = refresh the release PR; release = cut a release from this branch'
        type: choice
        options: [auto, pr, release]
        default: auto
      dry_run:
        description: 'Run everything except pushes, tags and the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

# One release flow at a time per repo — the PR refresh and the cut both push branches.
concurrency:
  group: plg-release
  cancel-in-progress: false

jobs:
  release:
    # Pin to a reviewed chodeus-ops commit — @main would run upstream changes with RELEASE_TOKEN.
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-release.yml@REPLACE_WITH_REVIEWED_SHA
    with:
      plg_file: PLUGIN.plg      # <- your manifest, same path as the filter above
      stable_branch: main
      beta_branch: beta         # drop for a single-channel plugin
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
