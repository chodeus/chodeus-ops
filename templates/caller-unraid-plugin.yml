# Drop into .github/workflows/release.yml of an Unraid plugin repo.
# Needs: a RELEASE_TOKEN secret (fine-grained PAT, Contents + Pull requests RW),
# a CHANGELOG.md (migrate with `plg_release.py migrate`), and a pkg_build.sh that
# accepts --version/--branch and writes dist/<pkg>.txz.

name: Release

on:
  push:
    branches: [main, beta]
    paths:
      - 'src/**'
      - 'pkg_build.sh'
      - 'folder.view3.plg'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = decide from the pushed commit; pr = refresh the release PR; release = cut a release from this branch'
        type: choice
        options: [auto, pr, release]
        default: auto
      dry_run:
        description: 'Run everything except pushes, tags and the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

# One release flow at a time per repo — the PR refresh and the cut both push branches.
concurrency:
  group: plg-release
  cancel-in-progress: false

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-release.yml@main
    with:
      plg_file: folder.view3.plg
      stable_branch: main
      beta_branch: beta
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
