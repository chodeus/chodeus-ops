# Drop into .github/workflows/release.yml of an Unraid plugin repo.
# Replace PLUGIN.plg with your manifest's path in BOTH places below (the paths filter and
# plg_file) — editing only one leaves a filter that never matches, so nothing ever triggers.
# Needs a RELEASE_TOKEN secret (fine-grained PAT, Contents + Pull requests RW), a CHANGELOG.md
# (migrate with `plg_release.py migrate`), and a pkg_build.sh taking --version/--branch that
# writes dist/<pkg>.txz. Pin the uses: ref below to a reviewed chodeus-ops commit.

name: Release

on:
  push:
    branches: [main, beta]
    paths:
      - 'src/**'
      - 'pkg_build.sh'
      - 'PLUGIN.plg'      # <- your manifest
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = decide from the pushed commit; pr = refresh the release PR; release = cut a release from this branch'
        type: choice
        options: [auto, pr, release]
        default: auto
      dry_run:
        description: 'Run everything except pushes, tags and the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

# One release flow at a time per repo — the PR refresh and the cut both push branches.
concurrency:
  group: plg-release
  cancel-in-progress: false

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-release.yml@main
    with:
      plg_file: PLUGIN.plg      # <- your manifest, same path as the filter above
      stable_branch: main
      beta_branch: beta         # drop for a single-channel plugin
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
