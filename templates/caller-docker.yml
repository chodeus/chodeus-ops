# Drop into .github/workflows/docker-publish.yml of a Docker repo.
# Builds, scans and smoke-tests on every PR; pushes to GHCR on main, v* tags and dispatch.

name: Docker build & publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The union of what docker-build's jobs declare; GitHub checks it at startup,
    # even for the push job a PR run skips.
    permissions:
      contents: read
      packages: write
      security-events: write
    # Pin to an immutable SHA and roll it by hand: Renovate is disabled for
    # chodeus-ops pins, and @main would run every new commit with a write token.
    uses: chodeus/chodeus-ops/.github/workflows/docker-build.yml@c36f1a3c7e8108f86b3be0e19c5e0d08502f681f # main
    with:
      # dockerfile_path: deploy/docker/Dockerfile   # when the Dockerfile is not at the root
      # build_context: deploy/docker
      push: ${{ github.event_name != 'pull_request' }}
      # Wait for the image's own HEALTHCHECK on every platform before pushing.
      smoke_healthcheck: true

  notify:
    if: always() && github.event_name != 'pull_request'
    needs: build
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@c36f1a3c7e8108f86b3be0e19c5e0d08502f681f # main
    with:
      event_type: build
      status: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
