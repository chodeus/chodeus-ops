# Drop into .github/workflows/stale.yml of any repo.

name: Stale issues & PRs

on:
  schedule:
    - cron: '0 5 * * *'  # daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    # What stale-issues.yml declares: it labels and closes issues and PRs.
    permissions:
      issues: write
      pull-requests: write
    uses: chodeus/chodeus-ops/.github/workflows/stale-issues.yml@b99e2de33ae9b77ee53dbc1c2d35f7eb79b88181 # main
