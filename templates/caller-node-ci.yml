# Drop into a repo's .github/workflows/ (e.g. as node-ci.yml or as a job
# in an existing lint workflow). Customize inputs as needed.

name: Node CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/node-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

permissions:
  contents: read

jobs:
  frontend-lint:
    permissions:
      contents: read
    uses: chodeus/chodeus-ops/.github/workflows/node-ci.yml@b99e2de33ae9b77ee53dbc1c2d35f7eb79b88181 # main
    with:
      node_version: '20'
      package_json_dir: frontend
      run_lint: true
      run_stylelint: true
      run_prettier_check: true
