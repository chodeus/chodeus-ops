# Drop into .github/workflows/release-please.yml of any Docker repo.
# Also requires release-please-config.json, .release-please-manifest.json, and VERSION at repo root,
# and Settings > Actions > "Allow GitHub Actions to create and approve pull requests" enabled.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # release-please.yml approves its release PR's CI runs.
  actions: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@cbd544d21103cfe854c8e0ec717ee2be4f097ad7 # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    # with:
    #   automerge: true   # also add a schedule trigger; needs required checks that always report on PRs
