# Drop into .github/workflows/release-please.yml of any Docker repo.
# Also requires release-please-config.json, .release-please-manifest.json, and VERSION at repo root,
# and Settings > Actions > "Allow GitHub Actions to create and approve pull requests" enabled.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # release-please.yml approves its release PR's CI runs.
  actions: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@1fcf653ea7ccc8c3cc5b8897d38c4b3f640010c0 # main
    # with:
    #   automerge: true   # release PRs merge themselves; needs "Allow auto-merge" and required checks that always report
