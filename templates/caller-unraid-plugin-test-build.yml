# Caller for on-demand test builds of an Unraid plugin: replace PLUGIN.plg below, then run it from
# the Actions tab on the branch to test. Inputs: .github/workflows/unraid-plugin-test-build.yml.

name: Test build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional YYYY.MM.DD[.N]. Empty = yesterday + .9<UTC build time>, which installs over the current release and is superseded by the next one.'
        type: string
        default: ''

permissions:
  contents: read

# Each build publishes its own test-<version> pre-release and removes the others, so runs never overlap
# and a pending run replaced by a newer one only skips a build the newer would remove anyway.
concurrency:
  group: plg-test-build
  cancel-in-progress: false

jobs:
  test-build:
    # The called workflow can use at most what this job grants: it publishes the pre-release and removes older ones.
    permissions:
      contents: write
    # Pin to a reviewed chodeus-ops commit.
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-test-build.yml@ab24506df084c71a4ca0f04b29ec96315cbbe42f # main
    with:
      plg_file: PLUGIN.plg      # <- your manifest
      version: ${{ inputs.version || '' }}
